[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthlens"
version = "0.1.0"
description = "Detect AI-generated images with transparent, no-ML forensic analysis. Web UI, REST API, and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "synthlens" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "Pillow>=10.2",
    "pywavelets>=1.5",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
synthlens = "synthlens.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthlens*"]

[tool.setuptools.package-data]
"synthlens.server" = ["templates/*.html", "static/*"]